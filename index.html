<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF5F7">
<title>圆圆's 工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --pink-50:#FFF5F7;
  --pink-100:#FFE4EC;
  --pink-200:#FFD1DC;
  --pink-300:#FFB6C1;
  --pink-400:#FF9FB1;
  --pink-500:#FF7A95;
  --pink-600:#E85A78;
  --rose-50:#FFF0F3;
  --rose-100:#FFE0E6;
  --rose-200:#FFC4CF;
  --cream:#FFF8F2;
  --text:#5C4A52;
  --text-soft:#8B7480;
  --text-light:#B5A2A8;
  --line:#F5DDE4;
  --line-soft:#FCE9EE;
  --shadow:0 4px 20px rgba(255,122,149,.10);
  --shadow-md:0 8px 28px rgba(255,122,149,.14);
  --radius:18px;
  --radius-sm:12px;
  --radius-lg:24px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:linear-gradient(135deg,#FFF5F7 0%,#FFF0F3 50%,#FFF8F2 100%);
  color:var(--text);
  font-size:14px;
  line-height:1.6;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;color:inherit;outline:none;border:none;background:none}
textarea{resize:none}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--pink-200);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 整体布局 ===== */
.app{display:flex;height:100vh;height:100dvh;width:100vw;position:relative}

/* ===== 背景小花朵 ===== */
.bg-flowers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-flowers span{position:absolute;opacity:.25;font-size:24px;animation:float 14s ease-in-out infinite}
.bg-flowers span:nth-child(1){top:8%;left:5%;animation-delay:0s}
.bg-flowers span:nth-child(2){top:20%;right:8%;animation-delay:2s}
.bg-flowers span:nth-child(3){top:45%;left:3%;animation-delay:4s}
.bg-flowers span:nth-child(4){top:65%;right:5%;animation-delay:6s}
.bg-flowers span:nth-child(5){top:80%;left:8%;animation-delay:3s}
.bg-flowers span:nth-child(6){top:15%;left:50%;animation-delay:5s}
.bg-flowers span:nth-child(7){top:55%;right:15%;animation-delay:1s}
.bg-flowers span:nth-child(8){top:88%;right:25%;animation-delay:7s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-20px) rotate(15deg)}}

/* ===== 侧边栏 ===== */
.sidebar{
  width:240px;flex-shrink:0;background:rgba(255,255,255,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column;
  padding:20px 14px;position:relative;z-index:10;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.sidebar-header{
  display:flex;flex-direction:column;align-items:center;padding:14px 8px 18px;
  border-bottom:1px dashed var(--line);margin-bottom:12px;
}
.sidebar-avatar{
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink-200),var(--pink-300));
  display:flex;align-items:center;justify-content:center;font-size:28px;
  margin-bottom:8px;box-shadow:0 4px 12px rgba(255,182,193,.4);
}
.sidebar-title{font-size:17px;font-weight:600;color:var(--pink-600);letter-spacing:1px}
.sidebar-subtitle{font-size:11px;color:var(--text-light);margin-top:2px}

.nav-list{flex:1;overflow-y:auto;padding:4px 4px 14px}
.nav-group-title{
  font-size:11px;color:var(--text-light);padding:8px 10px 4px;
  letter-spacing:1px;text-transform:uppercase;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:var(--radius-sm);cursor:pointer;
  font-size:13.5px;color:var(--text-soft);
  transition:all .2s;margin-bottom:2px;position:relative;
}
.nav-item:hover{background:var(--pink-50);color:var(--text)}
.nav-item.active{
  background:linear-gradient(135deg,var(--pink-100),var(--pink-200));
  color:var(--pink-600);font-weight:600;
  box-shadow:0 3px 10px rgba(255,182,193,.3);
}
.nav-item .ico{font-size:18px;width:22px;text-align:center}
.nav-item .badge{
  margin-left:auto;background:var(--pink-300);color:#fff;
  font-size:10px;padding:2px 7px;border-radius:10px;min-width:18px;text-align:center;
}
.nav-item.active .badge{background:var(--pink-500)}

/* 侧边栏底部同步入口 */
.sidebar-footer{
  padding:10px 12px 14px;border-top:1px dashed var(--line);
  display:flex;align-items:center;justify-content:center;
}
.sidebar-footer .sync-entry{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--radius-sm);
  background:var(--pink-50);color:var(--pink-600);
  font-size:13px;font-weight:600;cursor:pointer;
  transition:all .2s;
}
.sidebar-footer .sync-entry:hover{
  background:linear-gradient(135deg,var(--pink-100),var(--pink-200));
  box-shadow:0 3px 10px rgba(255,182,193,.3);
}
.sidebar-footer .sync-entry .ico{font-size:18px;width:22px;text-align:center}
.sidebar-footer .sync-entry .status{
  margin-left:auto;font-size:11px;font-weight:500;
  padding:3px 8px;border-radius:10px;background:#fff;color:var(--pink-500);
}

/* ===== 顶部条（移动端） ===== */
.topbar{
  display:none;align-items:center;justify-content:space-between;
  padding:12px 16px;background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line-soft);
  position:sticky;top:0;z-index:20;
}
.menu-btn{
  width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  background:var(--pink-100);color:var(--pink-600);
}
.topbar-title{font-size:16px;font-weight:600;color:var(--pink-600)}
.topbar-actions{display:flex;gap:8px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  background:var(--pink-50);color:var(--pink-500);
}

/* ===== 主内容区 ===== */
.main{
  flex:1;overflow-y:auto;position:relative;z-index:1;padding:24px 32px;
}
.main-inner{max-width:960px;margin:0 auto}

/* ===== 侧边栏遮罩（移动端） ===== */
.mask{
  position:fixed;inset:0;background:rgba(92,74,82,.4);
  backdrop-filter:blur(2px);z-index:50;opacity:0;pointer-events:none;
  transition:opacity .25s;
}
.mask.show{opacity:1;pointer-events:auto}

/* ===== 通用卡片 ===== */
.card{
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:var(--radius);padding:18px 20px;
  box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.6);
  margin-bottom:16px;
}
.card-title{
  font-size:15px;font-weight:600;color:var(--text);
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
}
.card-title .ico{font-size:18px}
.card-title .extra{margin-left:auto;font-size:12px;color:var(--pink-500);font-weight:500}

/* ===== 首页 ===== */
.dashboard-hero{
  background:linear-gradient(135deg,var(--pink-100),var(--pink-200));
  border-radius:var(--radius-lg);padding:24px;
  position:relative;overflow:hidden;margin-bottom:16px;
  box-shadow:var(--shadow);
}
.dashboard-hero::before{
  content:"";position:absolute;top:-30px;right:-30px;
  width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.5),transparent 70%);
}
.dashboard-hero::after{
  content:"🌸";position:absolute;bottom:-10px;right:20px;
  font-size:60px;opacity:.3;
}
.dashboard-time{font-size:36px;font-weight:700;color:var(--pink-600);letter-spacing:1px;line-height:1.1}
.dashboard-date{font-size:13px;color:var(--text-soft);margin-top:6px}
.dashboard-mood{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.7);padding:6px 14px;border-radius:20px;
  font-size:12px;color:var(--pink-600);margin-top:12px;
  border:1px solid rgba(255,255,255,.8);
}

/* 打卡区 */
.checkin-card{
  display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;
}
.checkin-ring{
  position:relative;width:110px;height:110px;flex-shrink:0;
}
.checkin-ring svg{transform:rotate(-90deg);width:100%;height:100%}
.checkin-ring .ring-bg{fill:none;stroke:var(--pink-100);stroke-width:10}
.checkin-ring .ring-fg{
  fill:none;stroke:url(#ringGrad);stroke-width:10;stroke-linecap:round;
  transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1);
}
.checkin-ring .ring-text{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-size:22px;font-weight:600;color:var(--pink-600);
}
.checkin-ring .ring-text small{font-size:10px;color:var(--text-light);font-weight:400;margin-top:2px}
.checkin-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checkin-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--pink-50);border-radius:var(--radius-sm);
  font-size:12.5px;cursor:pointer;transition:all .2s;
  border:1px solid transparent;
}
.checkin-item:hover{background:var(--pink-100);transform:translateY(-1px)}
.checkin-item.done{
  background:linear-gradient(135deg,var(--pink-200),var(--pink-300));
  color:#fff;border-color:transparent;
}
.checkin-item.done .check-circle{
  background:#fff;color:var(--pink-500);
}
.checkin-item .ico{font-size:18px;width:22px;text-align:center}
.check-circle{
  width:18px;height:18px;border-radius:50%;flex-shrink:0;
  background:#fff;border:1.5px solid var(--pink-300);
  display:flex;align-items:center;justify-content:center;
  color:transparent;transition:all .2s;font-size:11px;
}

/* 激励语 */
.quote-card{
  background:linear-gradient(135deg,var(--cream),#FFF0F3);
  padding:20px 22px;border-radius:var(--radius);
  position:relative;overflow:hidden;margin-bottom:16px;
  border:1px solid var(--line-soft);
}
.quote-card::before{content:"❝";position:absolute;top:-10px;left:8px;font-size:60px;color:var(--pink-200);opacity:.5}
.quote-card .q-text{font-size:14px;color:var(--text);font-style:italic;position:relative;z-index:1}
.quote-card .q-en{font-size:12px;color:var(--text-light);margin-top:6px;position:relative;z-index:1}
.quote-card .q-emoji{position:absolute;bottom:8px;right:14px;font-size:24px;opacity:.5}

/* 功能概览 */
.overview-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
}
.overview-item{
  background:linear-gradient(135deg,var(--pink-50),#fff);
  border-radius:var(--radius-sm);padding:14px 10px;text-align:center;
  border:1px solid var(--line-soft);cursor:pointer;
  transition:all .2s;
}
.overview-item:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(255,182,193,.25);
  border-color:var(--pink-200);
}
.overview-item .ico{font-size:26px;margin-bottom:4px}
.overview-item .name{font-size:12px;color:var(--text)}
.overview-item .stat{font-size:10px;color:var(--pink-500);margin-top:2px;font-weight:500}

/* ===== 任务列表 ===== */
.task-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.task-search{
  flex:1;min-width:140px;padding:9px 14px;
  background:var(--pink-50);border-radius:20px;font-size:13px;
  border:1px solid var(--line-soft);
}
.task-search:focus{background:#fff;border-color:var(--pink-300)}
.btn{
  padding:9px 16px;border-radius:20px;font-size:13px;
  background:linear-gradient(135deg,var(--pink-300),var(--pink-400));
  color:#fff;display:inline-flex;align-items:center;gap:4px;
  transition:all .2s;box-shadow:0 3px 8px rgba(255,159,177,.3);
}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(255,159,177,.4)}
.btn.ghost{
  background:var(--pink-50);color:var(--pink-500);
  box-shadow:none;border:1px solid var(--line-soft);
}
.btn.ghost:hover{background:var(--pink-100)}
.btn.tiny{padding:5px 10px;font-size:11px;border-radius:14px}
.btn.danger{background:linear-gradient(135deg,#FFA8B8,#FF7A95)}

.task-list{display:flex;flex-direction:column;gap:6px}
.task-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:#fff;border-radius:var(--radius-sm);
  border:1px solid var(--line-soft);transition:all .2s;
}
.task-item:hover{box-shadow:0 3px 10px rgba(255,182,193,.15);border-color:var(--pink-200)}
.task-item.done{opacity:.55;background:var(--pink-50)}
.task-item.done .task-name{text-decoration:line-through}
.task-check{
  width:20px;height:20px;border-radius:50%;flex-shrink:0;
  border:1.8px solid var(--pink-300);background:#fff;
  display:flex;align-items:center;justify-content:center;
  color:transparent;font-size:11px;transition:all .2s;
  cursor:pointer;
}
.task-item.done .task-check{background:var(--pink-500);border-color:var(--pink-500);color:#fff}
.task-name{flex:1;font-size:13.5px}
.task-tag{
  font-size:10px;padding:2px 8px;border-radius:10px;
  background:var(--pink-100);color:var(--pink-600);
}
.task-del{
  width:24px;height:24px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-light);font-size:14px;transition:all .2s;
}
.task-del:hover{background:var(--pink-100);color:var(--pink-600)}

.task-input-row{
  display:flex;gap:8px;margin-top:10px;padding:10px;
  background:var(--pink-50);border-radius:var(--radius-sm);
}
.task-input{
  flex:1;padding:8px 12px;background:#fff;border-radius:14px;font-size:13px;
  border:1px solid var(--line-soft);
}
.task-input:focus{border-color:var(--pink-300)}

/* 客户注意事项 */
.client-task{
  background:linear-gradient(135deg,var(--pink-50),#fff);
  padding:14px;border-radius:var(--radius-sm);
  border-left:3px solid var(--pink-400);position:relative;
}
.client-task .c-name{font-weight:600;color:var(--pink-600);margin-bottom:4px}
.client-task .c-note{font-size:12.5px;color:var(--text);white-space:pre-wrap;line-height:1.7}
.client-task .c-meta{font-size:11px;color:var(--text-light);margin-top:6px}

/* ===== 双Tab ===== */
.tabs{
  display:flex;gap:4px;background:var(--pink-50);
  padding:4px;border-radius:14px;margin-bottom:12px;
}
.tab{
  flex:1;padding:9px 12px;border-radius:10px;
  font-size:13px;color:var(--text-soft);text-align:center;
  cursor:pointer;transition:all .2s;
}
.tab.active{
  background:#fff;color:var(--pink-600);font-weight:600;
  box-shadow:0 2px 6px rgba(255,182,193,.25);
}

/* ===== 编辑器 ===== */
.editor{
  background:var(--pink-50);border-radius:var(--radius);
  padding:14px;margin-bottom:14px;border:1px solid var(--line-soft);
}
.editor-toolbar{
  display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;
}
.editor textarea{
  width:100%;min-height:90px;padding:10px 12px;
  background:#fff;border-radius:12px;font-size:13.5px;line-height:1.7;
  border:1px solid var(--line-soft);
}
.editor textarea:focus{border-color:var(--pink-300)}
.editor-actions{
  display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;
}
.editor-hint{font-size:11px;color:var(--text-light);margin-left:auto}
.image-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  margin-top:10px;
}
.image-thumb{
  position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;
  background:var(--pink-100);
}
.image-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.image-thumb .rm{
  position:absolute;top:3px;right:3px;width:20px;height:20px;
  border-radius:50%;background:rgba(0,0,0,.55);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;cursor:pointer;
}
.paste-zone{
  border:1.5px dashed var(--pink-200);border-radius:12px;
  padding:18px;text-align:center;color:var(--text-light);
  font-size:12px;cursor:pointer;transition:all .2s;
  background:#fff;margin-top:8px;
}
.paste-zone:hover,.paste-zone.drag{border-color:var(--pink-400);background:var(--pink-50);color:var(--pink-500)}
.paste-zone .big{font-size:24px;display:block;margin-bottom:4px}

/* ===== 列表条目 ===== */
.entry{
  background:#fff;border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;
  border:1px solid var(--line-soft);transition:all .2s;
}
.entry:hover{box-shadow:0 4px 14px rgba(255,182,193,.15)}
.entry-head{
  display:flex;align-items:center;gap:8px;margin-bottom:6px;
  font-size:12px;color:var(--text-light);
}
.entry-head .type{
  background:var(--pink-100);color:var(--pink-600);
  padding:1px 8px;border-radius:8px;font-size:10px;
}
.entry-text{font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.entry-imgs{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;
}
.entry-imgs.grid-2{grid-template-columns:repeat(2,1fr)}
.entry-imgs.grid-1{grid-template-columns:repeat(1,1fr)}
.entry-actions{
  display:flex;gap:8px;margin-top:8px;font-size:11px;color:var(--text-light);
}
.entry-actions span{cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.entry-actions span:hover{color:var(--pink-500)}

/* ===== 灵感Tab ===== */
.insp-tabs{
  display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;
  scrollbar-width:none;margin-bottom:8px;
}
.insp-tabs::-webkit-scrollbar{display:none}
.insp-tab{
  flex-shrink:0;padding:8px 14px;border-radius:18px;
  background:#fff;color:var(--text-soft);font-size:12.5px;
  border:1px solid var(--line-soft);cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;
  white-space:nowrap;transition:all .2s;
}
.insp-tab.active{
  background:linear-gradient(135deg,var(--pink-300),var(--pink-400));
  color:#fff;border-color:transparent;
  box-shadow:0 3px 8px rgba(255,159,177,.3);
}
.insp-tab .badge{
  background:var(--pink-100);color:var(--pink-600);
  font-size:10px;padding:1px 6px;border-radius:8px;
}
.insp-tab.active .badge{background:rgba(255,255,255,.3);color:#fff}

.cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cat-chip{
  padding:5px 12px;border-radius:14px;background:#fff;
  border:1px solid var(--line-soft);font-size:12px;color:var(--text-soft);
  cursor:pointer;transition:all .2s;
}
.cat-chip.active{
  background:var(--pink-200);color:var(--pink-600);border-color:transparent;
}

/* ===== 例假模块 ===== */
.period-status{
  background:linear-gradient(135deg,var(--pink-100),var(--pink-200));
  padding:18px;border-radius:var(--radius);margin-bottom:14px;
  position:relative;overflow:hidden;
}
.period-status::after{content:"🌷";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:54px;opacity:.4}
.period-status .p-label{font-size:11px;color:var(--text-soft)}
.period-status .p-state{font-size:18px;font-weight:600;color:var(--pink-600);margin-top:4px}
.period-status .p-info{font-size:12px;color:var(--text-soft);margin-top:6px}
.period-status .p-countdown{
  display:inline-block;background:rgba(255,255,255,.7);
  padding:4px 10px;border-radius:10px;font-size:12px;
  color:var(--pink-600);margin-top:6px;
}
.period-form{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;
}
.period-form label{font-size:12px;color:var(--text-soft);display:block;margin-bottom:4px}

/* ===== Toast ===== */
.toast{

/* ===== 模态框 ===== */
.modal{

.modal-close{

@media (max-width:768px){

/* ===== IndexedDB 本地双重备份 ===== */
let _idb=null;
let _saveCount=0;
const IDB_NAME='yuanyuan_db';
const IDB_STORE='backup';
function idbGet(){
  return new Promise((res,rej)=>{
    if(!('indexedDB' in window)){return res(null);}
    if(_idb){return res(_idb);}
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){db.createObjectStore(IDB_STORE);}
    };
    req.onsuccess=e=>{_idb=e.target.result;res(_idb);};
    req.onerror=()=>res(null);
  });
}
async function idbWrite(data){
  try{
    const db=await idbGet();if(!db)return;
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(data,'latest');
    tx.oncomplete=()=>{};
  }catch(e){}
}
async function idbRead(){
  return new Promise(async(res)=>{
    try{
      const db=await idbGet();if(!db)return res(null);
      const tx=db.transaction(IDB_STORE,'readonly');
      const req=tx.objectStore(IDB_STORE).get('latest');
      req.onsuccess=()=>res(req.result||null);
      req.onerror=()=>res(null);
    }catch(e){res(null);}
  });
}

/* ===== GitHub Gist 云端同步 ===== */
/* 创建精简同步数据（排除 base64 图片/文件，防止超过 Gist 1MB 限制） */
function getSyncState(){
  const sync = JSON.parse(JSON.stringify(STATE));
  if(sync.quickTransfers){
    sync.quickTransfers = sync.quickTransfers.map(qt=>{
      const s={...qt}; delete s.fileData; delete s.images; return s;
    });
  }
  ['reflections','inspirations','snippets'].forEach(key=>{
    if(sync[key]){
      sync[key] = sync[key].map(item=>{
        const s={...item}; if(s.images) s.images=[]; return s;
      });
    }
  });
  return sync;
}
/* 合并远程数据到本地（按 id 去重，保留本地已有数据） */
function mergeRemoteState(remote){
  const arrKeys=['tasks','clientTasks','englishWords','reflections','inspirations','periodRecords','weightRecords','scripts','clients','snippets','quickTransfers'];
  let changed=false;
  arrKeys.forEach(k=>{
    if(remote[k]&&Array.isArray(remote[k])){
      const ids=new Set(STATE[k].map(x=>x.id));
      remote[k].forEach(item=>{
        if(item.id&&!ids.has(item.id)){STATE[k].push(item);changed=true;}
      });
    }
  });
  if(remote.checkins){
    Object.keys(remote.checkins).forEach(d=>{
      if(!STATE.checkins[d]){STATE.checkins[d]=remote.checkins[d];changed=true;}
    });
  }
  if(remote.ui){Object.assign(STATE.ui,remote.ui);}
  if(remote.tradeWords){if(!STATE.tradeWords)STATE.tradeWords=remote.tradeWords;}
  return changed;
}

function startGistSync(){
  const code = localStorage.getItem(SYNC_CODE_KEY)||'';
  if(!code) return false;
  syncEnabled = true;
  updateSyncBtn('syncing');
  gistPull().then(()=>{
    updateSyncBtn('synced');
    pollTimer = setInterval(gistPull, 30000);
  }).catch(()=>{
    updateSyncBtn('error');
  });
  return true;
}
function stopGistSync(){
  syncEnabled = false;
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  updateSyncBtn('off');
}

/* 获取 Gist 文件完整内容（处理截断） */
async function getGistContent(file){
  if(!file) return '';
  let content = file.content || '';
  if(file.truncated && file.raw_url){
    const rawResp = await fetch(file.raw_url, {
      headers: { 'Authorization': 'token '+GITHUB_TOKEN }
    });
    content = await rawResp.text();
  }
  return content;
}

async function gistPull(){
  if(!syncEnabled) return;
  try{
    updateSyncBtn('syncing');
    const resp = await fetch('https://api.github.com/gists/'+GIST_ID, {
      headers: { 'Authorization': 'token '+GITHUB_TOKEN }
    });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const data = await resp.json();
    const file = data.files && data.files['sync-data.json'];
    if(!file){ updateSyncBtn('synced'); return; }

    const content = await getGistContent(file);
    if(!content){ updateSyncBtn('synced'); return; }

    const parsed = JSON.parse(content);
    const code = localStorage.getItem(SYNC_CODE_KEY);
    const remote = parsed[code];
    if(remote && remote.state){
      const remoteTime = remote.updatedAt || 0;
      if(remoteTime > lastRemoteUpdate){
        lastRemoteUpdate = remoteTime;
        const changed = mergeRemoteState(remote.state);
        if(changed){
          localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
          idbWrite(JSON.stringify(STATE));
          render();
          toast('☁️ 已从云端同步新数据');
        }
      }
    }
    updateSyncBtn('synced');
  }catch(e){
    console.error('Gist pull error:', e);
    updateSyncBtn('error');
  }
}
function gistPush(){
  if(!syncEnabled) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async ()=>{
    isSyncing = true;
    updateSyncBtn('syncing');
    try{
      const resp = await fetch('https://api.github.com/gists/'+GIST_ID, {
        headers: { 'Authorization': 'token '+GITHUB_TOKEN }
      });
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      const data = await resp.json();
      const file = data.files && data.files['sync-data.json'];

      let allData = {};
      if(file){
        const content = await getGistContent(file);
        if(content){
          allData = JSON.parse(content);
        }
      }

      const code = localStorage.getItem(SYNC_CODE_KEY);
      allData[code] = { state: getSyncState(), updatedAt: Date.now() };
      lastRemoteUpdate = allData[code].updatedAt;

      const pushResp = await fetch('https://api.github.com/gists/'+GIST_ID, {
        method: 'PATCH',
        headers: {
          'Authorization': 'token '+GITHUB_TOKEN,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          files: { 'sync-data.json': { content: JSON.stringify(allData) } }
        })
      });
      if(!pushResp.ok) throw new Error('HTTP '+pushResp.status);

      isSyncing = false;
      updateSyncBtn('synced');
    }catch(e){
      isSyncing = false;
      updateSyncBtn('error');
      console.error('Gist push error:', e);
      toast('⚠️ 同步失败：'+e.message);
    }
  }, 2000);
}
function cloudSync(){
  if(syncEnabled) gistPush();
}

    error:  {icon:'⚠️', color:'#E57373',        title:'同步失败，点击重试',      label:'失败'}

  const s = map[status]||map.off;

function fmtDate(d){
  const dt = typeof d==='string'?new Date(d):d;
  if(isNaN(dt))return d;
  const y=dt.getFullYear(),m=String(dt.getMonth()+1).padStart(2,'0'),day=String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtDateFull(d){
  const dt = typeof d==='string'?new Date(d):d;
  if(isNaN(dt))return d;
  const w=['日','一','二','三','四','五','六'][dt.getDay()];
  return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日 星期${w}`;
}

}

/* ===== 图片压缩 ===== */
function compressImage(file, maxSize=1200, quality=0.85){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxSize || h>maxSize){
          if(w>h){h=Math.round(h*maxSize/w);w=maxSize}
          else{w=Math.round(w*maxSize/h);h=maxSize}
        }
        const c=document.createElement('canvas');
        c.width=w;c.height=h;
        const ctx=c.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        const data=c.toDataURL('image/jpeg', quality);
        resolve(data);
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function handleImageFiles(files, maxCount=9){
  const arr=Array.from(files).slice(0,maxCount);
  const out=[];
  for(const f of arr){
    if(!f.type.startsWith('image/'))continue;
    try{ out.push(await compressImage(f)); }catch(e){console.error(e)}
  }
  return out;
}

  {word:'chargeable weight', meaning:'计费重量', ex:'Air freight is calculated by chargeable weight, not actual weight.'},
  {word:'cbm', meaning:'立方米', ex:'The total volume is about 15 cbm.'},
  {word:'carton dimension', meaning:'纸箱尺寸', ex:'Please confirm the carton dimension for freight cost.'},
  {word:'palletize', meaning:'打托盘', ex:'Do you need us to palletize the cartons?'}
];
function getDailyTradeWords(dayOffset=0){
  // 每天推荐 3 个，按日期轮换
  const perDay = 3;
  const base = new Date(todayKey());
  const idx = Math.floor(base.getTime()/86400000) * perDay + dayOffset * perDay;
  const out = [];
  for(let i=0;i<perDay;i++){
    out.push(TRADE_WORDS[(idx+i) % TRADE_WORDS.length]);
  }
  return out;
}

function addTradeWordToToday(idx){
  const w = TRADE_WORDS[idx];
  if(!w) return;
  const exist = STATE.englishWords.find(x=>x.word.toLowerCase()===(w.word||w.w||'').toLowerCase());
  if(exist){ toast('这个词已经在你的学习列表里啦'); return; }
  const meaningParts = [w.meaning||w.m||''];
  if(w.ex) meaningParts.push('例句：'+w.ex);
  STATE.englishWords.push({id:uid(), word:w.word||w.w, meaning:meaningParts.join('\n'), date:todayKey()});
  const dk = todayKey();
  STATE.checkins[dk] = STATE.checkins[dk] || {};
  STATE.checkins[dk].english = true;
  save(); render(); toast('已加入今日学习 📚');
}

/* ===== 导航 ===== */
function buildNav(){
  const groups = {};
  Object.values(MODULES).forEach(m=>{
    (groups[m.group] = groups[m.group] || []).push(m);
  });
  const list = document.getElementById('navList');
  const groupOrder = ['日常','工作','学习','健康'];
  list.innerHTML = '';
  groupOrder.forEach(g=>{
    if(!groups[g])return;
    const t = document.createElement('div');
    t.className='nav-group-title';t.textContent=g;
    list.appendChild(t);
    groups[g].forEach(m=>{
      const it = document.createElement('div');
      it.className='nav-item';it.dataset.id=m.id;
      it.innerHTML=(m.ico?`<span class="ico">${m.ico}</span>`:'')+`<span>${m.name}</span>`;
      it.onclick=()=>switchModule(m.id);
      list.appendChild(it);
    });
  });
}
function switchModule(id){
  currentModule=id;
  document.querySelectorAll('.nav-item').forEach(n=>{
    n.classList.toggle('active', n.dataset.id===id);

  // 关闭手机侧栏
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mask').classList.remove('show');
  syncHash();
  render();
}

function getEnglishTodayCount(){
  return STATE.englishWords.filter(w=>w.date===todayKey()).length;
}
function computeStreak(){
  let s=0;
  const today=new Date();
  for(let i=0;i<365;i++){
    const d=new Date(today);d.setDate(today.getDate()-i);
    const dk=todayKey(d);
    const ci=STATE.checkins[dk]||{};
    const all5 = ci.english&&ci.water&&ci.deal&&ci.mood&&ci.review;
    if(all5)s++;
    else if(i>0)break;
    else continue;
  }
  return s;
}
function pad2(n){return String(n).padStart(2,'0')}
function getGreeting(h){
  // h: 0-23
  if(h>=5 && h<12) return {text:'☀️ 早安，今天也要元气满满哦~', emoji:'☀️'};
  if(h>=12 && h<18) return {text:'🌤 下午好，记得喝杯温水休息一下~', emoji:'🌤'};
  if(h>=18 && h<22) return {text:'🌙 晚上好，忙碌一天辛苦啦~', emoji:'🌙'};
  return {text:'🌙 夜深了，早点休息哦~', emoji:'🌙'};
}

    };

  if(addBtn) addBtn.onclick=()=>{
    inputRow.style.display=inputRow.style.display==='none'?'flex':'none';

  const confirm=document.getElementById('confirmAddTask');

    const t=document.getElementById('newTaskText').value.trim();

    STATE.tasks.push({id:uid(),text:t,tag,done:false,date:todayKey()});

  };
  document.querySelectorAll('.task-item').forEach(it=>{
    const id=it.dataset.id;
    it.querySelector('[data-act="toggle"]').onclick=()=>{
      const t=STATE.tasks.find(x=>x.id===id);
      t.done=!t.done;save();render();

    it.querySelector('[data-act="del"]').onclick=()=>{
      if(confirm('确定删除这个任务吗？')){

    };

function setupImageEditor(prefix, type){
  if(!window['_'+prefix+'Imgs']) window['_'+prefix+'Imgs']=[];
  const list = window['_'+prefix+'Imgs'];
  const renderImgs=()=>{
    const grid=document.getElementById(prefix+'Imgs');
    if(!grid)return;
    grid.innerHTML = list.map((src,i)=>`
      <div class="image-thumb">
        <img src="${src}"/>
        <div class="rm" data-rm="${i}">✕</div>
      </div>
    `).join('');
    grid.querySelectorAll('[data-rm]').forEach(el=>{
      el.onclick=()=>{list.splice(+el.dataset.rm,1);renderImgs()};
    });
    // 大图查看
    grid.querySelectorAll('img').forEach(img=>{
      img.onclick=()=>viewImage(img.src);
    });
  };
  const paste=document.getElementById(prefix+'Paste');
  if(paste){
    paste.onclick=()=>{
      const inp=document.createElement('input');
      inp.type='file';inp.accept='image/*';inp.multiple=true;
      inp.onchange=async e=>{
        const files=Array.from(e.target.files);
        const imgs=await handleImageFiles(files, 9-list.length);
        list.push(...imgs);
        renderImgs();
        toast(`已添加 ${imgs.length} 张图片`);
      };
      inp.click();
    };
    paste.ondragover=e=>{e.preventDefault();paste.classList.add('drag')};
    paste.ondragleave=()=>paste.classList.remove('drag');
    paste.ondrop=async e=>{
      e.preventDefault();paste.classList.remove('drag');
      const files=Array.from(e.dataTransfer.files);
      const imgs=await handleImageFiles(files, 9-list.length);
      list.push(...imgs);
      renderImgs();
      toast(`已添加 ${imgs.length} 张图片`);
    };
  }
  // 监听全局粘贴（仅在反思/灵感模块生效）
  const onPaste=async e=>{
    if(currentModule!=='reflect' && currentModule!=='inspiration')return;
    const items=e.clipboardData?.items||[];
    const files=[];
    for(const it of items){
      if(it.kind==='file' && it.type.startsWith('image/')){
        files.push(it.getAsFile());
      }
    }
    if(files.length===0)return;
    e.preventDefault();
    const imgs=await handleImageFiles(files, 9-list.length);
    list.push(...imgs);
    renderImgs();
    toast(`已粘贴 ${imgs.length} 张图片`);
  };
  document.removeEventListener('paste', window._pasteHandler||(()=>{}));
  window._pasteHandler=onPaste;
  document.addEventListener('paste', onPaste);
}

  showModal('图片预览',`

    <div style="text-align:center;margin-top:10px">
      <button class="btn ghost" id="closeImg">关闭</button>

function computePeriodStatus(){
  const today=new Date();
  const records = STATE.periodRecords.slice().sort((a,b)=>a.start.localeCompare(b.start));
  if(records.length===0){
    return {state:'尚未记录',info:'录入一次经期后即可开启预测',countdown:''};
  }
  // 计算平均周期
  let cycle = 28;
  if(records.length>=2){
    const cycles=[];
    for(let i=1;i<records.length;i++){
      const a=new Date(records[i-1].start);
      const b=new Date(records[i].start);
      const d=Math.round((b-a)/(1000*60*60*24));
      if(d>15 && d<60) cycles.push(d);
    }
    if(cycles.length>0) cycle = Math.round(cycles.reduce((x,y)=>x+y,0)/cycles.length);
  }
  // 找最近的经期
  const last = records[records.length-1];
  const lastStart = new Date(last.start);
  const lastEnd = last.end ? new Date(last.end) : new Date(lastStart.getTime()+4*86400000);
  const todayT = new Date(today.toISOString().slice(0,10));
  const nextStart = new Date(lastStart.getTime()+cycle*86400000);
  // 经期范围:最近一次到结束
  let state='',info='',countdown='';
  if(todayT >= lastStart && todayT <= lastEnd){
    const day = Math.round((todayT-lastStart)/86400000)+1;
    state='🌹 经期中';
    info=`第 ${day} 天 / 周期约 ${cycle} 天`;
    countdown = `下次预计：${fmtDate(nextStart)}`;
  } else {
    // 距下次
    const daysToNext = Math.round((nextStart-todayT)/86400000);
    if(daysToNext<=cycle && daysToNext>=0){
      // 计算排卵日 (下次月经前14天)
      const ovu = new Date(nextStart.getTime()-14*86400000);
      // 易孕期:排卵前5天到排卵后1天
      const fertileStart = new Date(ovu.getTime()-5*86400000);
      const fertileEnd = new Date(ovu.getTime()+1*86400000);
      if(todayT.getTime()===ovu.getTime()){
        state='💗 排卵日';
        info='今天最易受孕';
        countdown = `下次月经：${fmtDate(nextStart)}`;
      } else if(todayT>=fertileStart && todayT<=fertileEnd){
        const fday = Math.round((todayT-fertileStart)/86400000)+1;
        state='🌸 易孕期';
        info=`第 ${fday} 天 / 排卵：${fmtDate(ovu)}`;
        countdown = `下次月经：${fmtDate(nextStart)}`;
      } else if(daysToNext <= 7){
        state='⏰ 临近经期';
        info='注意保暖，避免生冷';
        countdown = `距下次还有 ${daysToNext} 天`;
      } else {
        state='☁️ 安全期';
        info='好好爱自己～';
        countdown = `距下次还有 ${daysToNext} 天`;
      }
    } else if(daysToNext<0){
      state='⚠️ 周期已过';
      info='建议录入新的经期记录';
      countdown = `已过 ${-daysToNext} 天`;
    }
  }
  return {state,info,countdown,cycle,last,nextStart};
}

function renderCalendar3Months(baseMonth){
  // 三个月:上个月/本月/下个月
  const m = new Date(baseMonth);
  let html = '';
  for(let i=-1;i<=1;i++){
    const dt = new Date(m.getFullYear(), m.getMonth()+i, 1);
    html += renderOneMonth(dt);
  }
  return `<div>${html}</div>`;
}
function renderOneMonth(monthDate){
  const y = monthDate.getFullYear();
  const m = monthDate.getMonth();
  const firstDay = new Date(y,m,1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  // 计算标记集
  const markers = computeMonthMarkers(y,m);
  const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  let html = `<div class="cal-month-label">${y} 年 ${monthNames[m]}</div>`;
  html += '<div class="cal-grid">';
  ['日','一','二','三','四','五','六'].forEach(w=>{
    html += `<div class="wd">${w}</div>`;
  });
  for(let i=0;i<startWeekday;i++) html += '<div class="cal-cell" style="visibility:hidden"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dk = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = markers[dk] || '';
    const isToday = dk === todayKey();
    html += `<div class="cal-cell ${cls} ${isToday?'today':''}">${d}</div>`;
  }
  html += '</div>';
  return html;
}
function computeMonthMarkers(y,m){
  const map = {};
  const todayT = new Date(todayKey());
  // 已记录
  STATE.periodRecords.forEach(p=>{
    const s = new Date(p.start);
    const e = p.end ? new Date(p.end) : new Date(s.getTime()+4*86400000);
    // 经期
    for(let d=new Date(s); d<=e; d.setDate(d.getDate()+1)){
      const dk = fmtDate(d);
      if(new Date(dk).getMonth()===m && new Date(dk).getFullYear()===y){
        map[dk] = 'period';
      }
    }
  });
  // 预测
  const records = STATE.periodRecords.slice().sort((a,b)=>a.start.localeCompare(b.start));
  if(records.length>0){
    let cycle=28;
    if(records.length>=2){
      const cycles=[];
      for(let i=1;i<records.length;i++){
        const a=new Date(records[i-1].start);
        const b=new Date(records[i].start);
        const d=Math.round((b-a)/86400000);
        if(d>15&&d<60)cycles.push(d);
      }
      if(cycles.length)cycle=Math.round(cycles.reduce((x,y)=>x+y,0)/cycles.length);
    }
    const lastStart = new Date(records[records.length-1].start);
    // 预测未来 3 个周期
    for(let c=1;c<=3;c++){
      const ps = new Date(lastStart.getTime()+cycle*c*86400000);
      const pe = new Date(ps.getTime()+4*86400000);
      // 经期
      for(let d=new Date(ps);d<=pe;d.setDate(d.getDate()+1)){
        const dk=fmtDate(d);
        if(new Date(dk).getMonth()===m && new Date(dk).getFullYear()===y){
          if(!map[dk]) map[dk] = 'pred-period';
        }
      }
      // 排卵
      const ovu = new Date(ps.getTime()-14*86400000);
      const fertS = new Date(ovu.getTime()-5*86400000);
      const fertE = new Date(ovu.getTime()+1*86400000);
      for(let d=new Date(fertS);d<=fertE;d.setDate(d.getDate()+1)){
        const dk=fmtDate(d);
        if(new Date(dk).getMonth()===m && new Date(dk).getFullYear()===y){
          const isOvu = dk===fmtDate(ovu);
          const k = isOvu ? 'pred-ovulation' : 'pred-fertile';
          if(!map[dk]) map[dk] = k;
        }
      }
    }
  }
  return map;
}

function renderWeightChart(list){
  if(list.length<2) return '<div style="text-align:center;color:var(--text-light);font-size:12px;padding:20px">记录 2 次以上显示趋势</div>';
  const sorted = list.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const ws = sorted.map(x=>x.weight);
  const max = Math.max(...ws), min = Math.min(...ws);
  const range = max-min || 1;
  const W=100, H=40;
  const points = sorted.map((x,i)=>{
    const xn = (i/(sorted.length-1))*W;
    const yn = H - ((x.weight-min)/range)*H;
    return [xn,yn];
  });
  const path = points.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<div class="weight-chart">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:120px">
      <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFB6C1" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#FFB6C1" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${path} L ${W} ${H} L 0 ${H} Z" fill="url(#wg)"/>
      <path d="${path}" fill="none" stroke="#FF7A95" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>
      ${points.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="0.8" fill="#FF7A95"/>`).join('')}
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-light);margin-top:4px">
      <span>${sorted[0].date.slice(5)}</span>
      <span>${sorted[sorted.length-1].date.slice(5)}</span>
    </div>
  </div>`;
}

    save();closeModal();render();toast('已保存 ✨');
  },true);
  // 内部:图片粘贴
  window._snImgs=[];
  const paste=document.getElementById('snPaste');
  const renderImgs=()=>{
    const grid=document.getElementById('snImgs');
    grid.innerHTML = window._snImgs.map((src,i)=>`<div class="image-thumb"><img src="${src}" data-view="${src}"/><div class="rm" data-rm="${i}">✕</div></div>`).join('');
    grid.querySelectorAll('[data-rm]').forEach(el=>{
      el.onclick=()=>{window._snImgs.splice(+el.dataset.rm,1);renderImgs()};
    });
    grid.querySelectorAll('img[data-view]').forEach(img=>{
      img.onclick=()=>viewImage(img.dataset.view);
    });
  };
  paste.onclick=()=>{
    const inp=document.createElement('input');
    inp.type='file';inp.accept='image/*';inp.multiple=true;
    inp.onchange=async e=>{
      const files=Array.from(e.target.files);
      const imgs=await handleImageFiles(files, 9-window._snImgs.length);
      window._snImgs.push(...imgs);
      renderImgs();
    };
    inp.click();
  };
  paste.ondragover=e=>{e.preventDefault();paste.classList.add('drag')};
  paste.ondragleave=()=>paste.classList.remove('drag');
  paste.ondrop=async e=>{
    e.preventDefault();paste.classList.remove('drag');
    const files=Array.from(e.dataTransfer.files);
    const imgs=await handleImageFiles(files, 9-window._snImgs.length);
    window._snImgs.push(...imgs);
    renderImgs();
  };
  // 全局粘贴
  const onPaste=async e=>{
    if(!document.getElementById('snPaste')) return;
    const items=e.clipboardData?.items||[];
    const files=[];
    for(const it of items){
      if(it.kind==='file' && it.type.startsWith('image/')){
        files.push(it.getAsFile());
      }
    }
    if(files.length===0) return;
    e.preventDefault();
    const imgs=await handleImageFiles(files, 9-window._snImgs.length);
    window._snImgs.push(...imgs);
    renderImgs();
    toast(`已粘贴 ${imgs.length} 张`);
  };
  document.addEventListener('paste', onPaste);
  // 清理
  const cleanup=()=>{
    document.removeEventListener('paste', onPaste);
    delete window._snImgs;
  };
  // 监听关闭
  const obs = new MutationObserver(()=>{
    if(!document.getElementById('snPaste')){
      cleanup();obs.disconnect();
    }
  });
  obs.observe(document.body, {childList:true,subtree:true});
}

function nowStr(){
  const d=new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function formatFileSize(bytes){
  if(!bytes)return '';
  if(bytes<1024)return bytes+'B';
  if(bytes<1024*1024)return (bytes/1024).toFixed(1)+'KB';
  return (bytes/1024/1024).toFixed(1)+'MB';
}
function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>resolve(e.target.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

    <div class="qt-timeline">

function renderQTItem(item){
  const typeMap={
    text:{ico:'📝',label:'文字',cls:'text'},
    image:{ico:'🖼',label:'图片',cls:'image'},
    file:{ico:'📄',label:'文档',cls:'file'}
  };
  const t=typeMap[item.type]||typeMap.text;
  const collectedCls=item.collected?'collected':'';
  const collectedBadge=item.collected?'<span class="qt-item-collected-badge">已存入资料库</span>':'';

  let contentHtml='';
  if(item.type==='text'){
    contentHtml=`<div class="qt-item-content">${escapeHtml(item.content)}</div>`;
  }else if(item.type==='image'){
    const imgs=item.images||[];
    contentHtml=`
      ${item.content?`<div class="qt-item-content" style="font-size:12px;color:var(--text-soft);margin-bottom:6px">${escapeHtml(item.content)}</div>`:''}
      <div class="qt-item-images ${imgs.length===1?'grid-1':imgs.length===2?'grid-2':''}">
        ${imgs.map(src=>`<div class="image-thumb"><img src="${src}" data-view="${src}"/></div>`).join('')}
      </div>
    `;
  }else if(item.type==='file'){
    const sizeStr=item.fileSize?`(${formatFileSize(item.fileSize)})`:'';
    contentHtml=`
      <div class="qt-item-content" style="font-weight:600">📄 ${escapeHtml(item.fileName||'未命名文档')} ${sizeStr}</div>
      ${item.content?`<div class="qt-item-content" style="font-size:12px;color:var(--text-soft);margin-top:4px">${escapeHtml(item.content)}</div>`:''}
    `;
  }

  let actions='';
  if(item.type==='text'){
    actions+=`<button class="btn tiny" data-act="copy">📋 复制</button>`;
  }
  if(item.type==='file'&&item.fileData){
    actions+=`<button class="btn tiny" data-act="download">⬇ 下载</button>`;
  }
  if(item.type==='image'){
    actions+=`<button class="btn tiny" data-act="copyimg">📋 复制图片</button>`;
  }
  if(!item.collected){
    actions+=`<button class="btn tiny ghost" data-act="collect">📌 存入资料库</button>`;
  }
  actions+=`<button class="btn tiny ghost" data-act="del">🗑 删除</button>`;

  return `
  <div class="qt-item ${collectedCls}" data-id="${item.id}">
    <div class="qt-item-head">
      <span class="qt-item-type ${t.cls}">${t.ico} ${t.label}</span>
      ${collectedBadge}
      <span class="qt-item-time">${item.date||''}</span>
    </div>
    ${contentHtml}
    <div class="qt-item-actions">${actions}</div>
  </div>
  `;
}
function bindQuickTransfer(){
  // 图片临时存储
  window._qtImgs=[];
  let qtFiles=[];
  const renderImgs=()=>{
    const grid=document.getElementById('qtImgs');
    if(!grid)return;
    grid.innerHTML=window._qtImgs.map((src,i)=>`
      <div class="image-thumb"><img src="${src}"/><div class="rm" data-rm="${i}">✕</div></div>
    `).join('');
    grid.querySelectorAll('[data-rm]').forEach(el=>{
      el.onclick=()=>{window._qtImgs.splice(+el.dataset.rm,1);renderImgs()};
    });
    grid.querySelectorAll('img').forEach(img=>{
      img.onclick=()=>viewImage(img.src);
    });
  };
  const renderFiles=()=>{
    const listEl=document.getElementById('qtFileList');
    if(!listEl)return;
    listEl.innerHTML=qtFiles.map((f,i)=>`
      <div class="qt-file-item">
        <span style="font-size:16px">📄</span>
        <span class="fn">${escapeHtml(f.name)}</span>
        <span class="fs">${formatFileSize(f.size)}</span>
        <div class="task-del" data-rmf="${i}">✕</div>
      </div>
    `).join('');
    listEl.querySelectorAll('[data-rmf]').forEach(el=>{
      el.onclick=()=>{qtFiles.splice(+el.dataset.rmf,1);renderFiles()};
    });
  };

  // 图片按钮
  const imgBtn=document.getElementById('qtImgBtn');
  if(imgBtn){
    imgBtn.onclick=()=>{
      const inp=document.createElement('input');
      inp.type='file';inp.accept='image/*';inp.multiple=true;
      inp.onchange=async e=>{
        const files=Array.from(e.target.files);
        const imgs=await handleImageFiles(files,9-window._qtImgs.length);
        window._qtImgs.push(...imgs);
        renderImgs();
        toast(`已添加 ${imgs.length} 张图片`);
      };
      inp.click();
    };
  }

  // 文档按钮
  const fileBtn=document.getElementById('qtFileBtn');
  if(fileBtn){
    fileBtn.onclick=()=>{
      const inp=document.createElement('input');
      inp.type='file';inp.multiple=true;
      inp.onchange=async e=>{
        const files=Array.from(e.target.files);
        for(const f of files){
          if(f.size>2*1024*1024){
            toast(`${f.name} 超过2MB，无法通过快传传输`);
            continue;
          }
          qtFiles.push(f);
        }
        renderFiles();
      };
      inp.click();
    };
  }

  // 全局粘贴图片
  const onPaste=async e=>{
    if(currentModule!=='transfer')return;
    const items=e.clipboardData?.items||[];
    const imgFiles=[];
    for(const it of items){
      if(it.kind==='file'&&it.type.startsWith('image/')){
        imgFiles.push(it.getAsFile());
      }
    }
    if(imgFiles.length>0){
      e.preventDefault();
      const imgs=await handleImageFiles(imgFiles,9-window._qtImgs.length);
      window._qtImgs.push(...imgs);
      renderImgs();
      toast(`已粘贴 ${imgs.length} 张图片`);
    }
  };
  document.removeEventListener('paste',window._qtPasteHandler||(()=>{}));
  window._qtPasteHandler=onPaste;
  document.addEventListener('paste',onPaste);

  // 发送按钮
  const sendBtn=document.getElementById('qtSend');
  if(sendBtn){
    sendBtn.onclick=async ()=>{
      const text=document.getElementById('qtText').value.trim();
      const imgs=window._qtImgs||[];
      if(!text&&imgs.length===0&&qtFiles.length===0){
        toast('请输入内容或添加图片/文档');
        return;
      }
      const ts=nowStr();
      // 文字
      if(text){
        STATE.quickTransfers.push({id:uid(),type:'text',content:text,date:ts,collected:false});
      }
      // 图片
      if(imgs.length>0){
        STATE.quickTransfers.push({id:uid(),type:'image',content:'',images:imgs,date:ts,collected:false});
      }
      // 文档
      for(const f of qtFiles){
        try{
          const dataUrl=await readFileAsDataURL(f);
          STATE.quickTransfers.push({
            id:uid(),type:'file',
            fileName:f.name,fileSize:f.size,fileType:f.type,fileData:dataUrl,
            content:'',date:ts,collected:false
          });
        }catch(e){console.error(e);toast(`${f.name} 读取失败`)}
      }
      // 清空输入
      document.getElementById('qtText').value='';
      window._qtImgs=[];
      qtFiles=[];
      renderImgs();renderFiles();
      save();render();
      toast('已发送 ✨');
    };
  }

  // 条目操作
  document.querySelectorAll('.qt-item').forEach(el=>{
    const id=el.dataset.id;
    const item=()=>STATE.quickTransfers.find(x=>x.id===id);

    const copyBtn=el.querySelector('[data-act="copy"]');
    if(copyBtn){
      copyBtn.onclick=async()=>{
        const it=item();if(!it)return;
        try{await navigator.clipboard.writeText(it.content);toast('已复制 📋')}
        catch(e){
          const ta=document.createElement('textarea');ta.value=it.content;
          document.body.appendChild(ta);ta.select();document.execCommand('copy');
          document.body.removeChild(ta);toast('已复制 📋');
        }
      };
    }
    const copyImgBtn=el.querySelector('[data-act="copyimg"]');
    if(copyImgBtn){
      copyImgBtn.onclick=async()=>{
        const it=item();if(!it||!it.images||!it.images.length)return;
        try{
          const resp=await fetch(it.images[0]);
          const blob=await resp.blob();
          await navigator.clipboard.write([new ClipboardItem({[blob.type]:blob})]);
          toast('图片已复制 📋');
        }catch(e){toast('复制失败，请长按图片保存')}
      };
    }
    const dlBtn=el.querySelector('[data-act="download"]');
    if(dlBtn){
      dlBtn.onclick=()=>{
        const it=item();if(!it||!it.fileData)return;
        const a=document.createElement('a');
        a.href=it.fileData;a.download=it.fileName||'download';a.click();
        toast('开始下载 ⬇');
      };
    }
    const collectBtn=el.querySelector('[data-act="collect"]');
    if(collectBtn){
      collectBtn.onclick=()=>{
        const it=item();if(!it)return;
        if(it.type==='text'){
          STATE.snippets.push({id:uid(),type:'text',content:it.content,date:todayKey()});
        }else if(it.type==='image'){
          STATE.snippets.push({id:uid(),type:'image',text:'',images:it.images,date:todayKey()});
        }else if(it.type==='file'){
          STATE.snippets.push({
            id:uid(),type:'doc',docName:it.fileName,docPath:'',
            docDesc:'从快传存入'+(it.fileSize?' · '+formatFileSize(it.fileSize):''),
            date:todayKey()
          });
        }
        it.collected=true;
        save();render();toast('已存入资料库 📌');
      };
    }
    const delBtn=el.querySelector('[data-act="del"]');
    if(delBtn){
      delBtn.onclick=()=>{
        if(confirm('确定删除这条传输记录？')){
          STATE.quickTransfers=STATE.quickTransfers.filter(x=>x.id!==id);
          save();render();toast('已删除');
        }
      };
    }
  });

  // 时间线图片预览
  document.querySelectorAll('.qt-item .image-thumb img').forEach(img=>{
    img.onclick=()=>viewImage(img.dataset.view||img.src);
  });
}

let modalConfirmHandler = null;
let modalHasPaste = false;
function showModal(title, html, onConfirm, hasOk=true, enablePaste=false){
  const modal=document.getElementById('modal');
  const box=document.getElementById('modalBox');
  box.innerHTML = `
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-title">${title}</div>
    ${html}
  `;
  modal.classList.add('show');
  modalConfirmHandler = onConfirm;
  document.getElementById('modalClose').onclick=closeModal;
  if(hasOk && onConfirm){
    const saveBtn = box.querySelector('#sSave, #snSave, #ctSave, #wSave, #cliSave');
    if(saveBtn) saveBtn.onclick=onConfirm;
    const cancel = box.querySelector('#sCancel, #snCancel, #ctCancel, #wCancel, #cliCancel');
    if(cancel) cancel.onclick=closeModal;
  }
  if(enablePaste){
    // 全局粘贴文字
    const onPaste=e=>{
      if(!document.getElementById('snText')) return;
      const text = e.clipboardData?.getData('text');
      if(text){
        const ta = document.getElementById('snText');
        ta.value = (ta.value||'') + text;
        e.preventDefault();
      }
    };
    modalHasPaste = onPaste;
    document.addEventListener('paste', onPaste);
  }
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  modalConfirmHandler=null;
  if(modalHasPaste){
    document.removeEventListener('paste', modalHasPaste);
    modalHasPaste=null;
  }
}

  showModal('☁️ 云端同步', `
    <div class="modal-form" style="max-width:420px">

        电脑和手机打开同一个网址，输入相同的同步码，数据就会自动同步。<br>
        <b>文字、待办、单词、记录</b>等内容会同步到云端。<br>
        <b>图片和文件</b>因体积较大，仅保存在本设备，不同步到云端。<br><br>
        <b>步骤：</b>在电脑上设好同步码 → 手机上输入同一个同步码 → 自动同步

      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn" id="syncConnect">${isOn?'重新连接':'开启同步'}</button>
        ${isOn?'<button class="btn ghost" id="syncForceSync">立即同步</button>':''}
        ${isOn?'<button class="btn ghost" id="syncDisconnect">断开</button>':''}
      </div>
      <button class="btn ghost" id="syncCancel" style="margin-top:8px;width:100%">关闭</button>
    </div>
  `, null, false);
  document.getElementById('syncCancel').onclick=closeModal;
  const disBtn=document.getElementById('syncDisconnect');
  if(disBtn) disBtn.onclick=()=>{
    stopGistSync();
    closeModal();
    toast('已断开云端同步');
  };
  const forceBtn=document.getElementById('syncForceSync');
  if(forceBtn) forceBtn.onclick=()=>{
    closeModal();
    toast('正在同步…');
    gistPush();
    setTimeout(()=>gistPull(), 1500);
  };
  document.getElementById('syncConnect').onclick=()=>{
    const code=document.getElementById('syncCode').value.trim();
    if(!code){ toast('请输入同步码'); return; }
    localStorage.setItem(SYNC_CODE_KEY, code);
    closeModal();
    toast('正在连接…');
    if(syncEnabled) stopGistSync();
    setTimeout(()=>{
      startGistSync();
      toast('☁️ 云端同步已开启！');
    },300);
  };
}

function init(){
  load();
  // IndexedDB 异步恢复：如果 localStorage 无数据，尝试从 IndexedDB 恢复
  (async()=>{
    const hasData = STATE.tasks.length>0 || STATE.englishWords.length>0 || STATE.reflections.length>0 || STATE.clients.length>0 || STATE.inspirations.length>0 || STATE.quickTransfers.length>0 || STATE.periodRecords.length>0 || STATE.weightRecords.length>0;
    if(!hasData){
      const idbData = await idbRead();
      if(idbData){
        try{
          Object.assign(STATE, JSON.parse(idbData));
          save(); render();
          toast('已从本地备份恢复数据 🔄');
        }catch(e){}
      }
    }
  })();
  buildNav();
  // 侧栏默认激活首页
  document.querySelector('.nav-item[data-id="dashboard"]').classList.add('active');
  render();
  // 移动端菜单
  document.getElementById('menuBtn').onclick=()=>{
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('mask').classList.add('show');
  };
  document.getElementById('mask').onclick=()=>{
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('mask').classList.remove('show');
  };
  // 移动端侧边栏左滑收起
  (()=>{
    const sidebar = document.getElementById('sidebar');
    let startX = 0, startY = 0, isOpen = false;
    sidebar.addEventListener('touchstart', e=>{
      if(!sidebar.classList.contains('open')) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      isOpen = true;
    }, {passive:true});
    sidebar.addEventListener('touchmove', e=>{
      if(!isOpen) return;
      const x = e.touches[0].clientX;
      const y = e.touches[0].clientY;
      const dx = x - startX;
      const dy = y - startY;
      // 水平左滑超过 50px，且横向移动大于纵向
      if(dx < -50 && Math.abs(dx) > Math.abs(dy)){
        sidebar.classList.remove('open');
        document.getElementById('mask').classList.remove('show');
        isOpen = false;
      }
    }, {passive:true});
    sidebar.addEventListener('touchend', ()=>{ isOpen=false; });
  })();
  // URL 参数: ?drawer=1 自动打开移动端抽屉（预览用）
  if(location.search.includes('drawer=1')){
    setTimeout(()=>{
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('mask').classList.add('show');
    }, 600);
  }
  // 顶部操作
  document.getElementById('topbarBackup').onclick=exportData;
  document.getElementById('topbarImport').onclick=importData;
  // 云端同步
  document.getElementById('topbarSync').onclick=openSyncPanel;
  const sidebarSyncBtn = document.getElementById('sidebarSync');
  if(sidebarSyncBtn) sidebarSyncBtn.onclick=openSyncPanel;
  if(localStorage.getItem(SYNC_CODE_KEY)){
    startGistSync();
  }else{
    updateSyncBtn('off');
  }
  // 时钟更新（每秒，含秒和动态问候语）
  setInterval(()=>{
    if(currentModule==='dashboard'){
      const d=new Date();
      const t = document.querySelector('.dashboard-time');
      const m = document.querySelector('.dashboard-mood');
      if(t) t.textContent = pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds());
      if(m){
        const g = getGreeting(d.getHours());
        if(!m.textContent.includes(g.emoji)) m.textContent = g.text;
      }
    }
  }, 1000);
  // Service Worker 注册（PWA 离线可用）
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }
}
init();
</script>
</body>
</html>
